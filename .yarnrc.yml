nodeLinker: node-modules

# Dependencies run no install scripts unless package.json allows them in dependenciesMeta.
enableScripts: false

# Complete the upstream manifests with their actual dependency requirements.
# No warning filters, optional-peer substitutions, or version overrides.
packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3
  '@astrojs/language-server@2.17.3':
    peerDependencies:
      typescript: '*'
