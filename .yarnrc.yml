nodeLinker: node-modules

# Only the native tools explicitly listed in package.json may run install scripts.
enableScripts: false

# Complete the upstream manifests with their actual dependency requirements.
# No warning filters, optional-peer substitutions, or version overrides.
packageExtensions:
  '@astrojs/language-server@2.16.16':
    peerDependencies:
      typescript: '*'
  '@astrojs/compiler-binding-wasm32-wasi@0.4.0':
    dependencies:
      '@emnapi/core': '^1.7.1'
      '@emnapi/runtime': '^1.7.1'
