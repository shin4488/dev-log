version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait a week after each release; this does not delay security updates.
    cooldown:
      default-days: 7
    groups:
      react:
        # Keep the runtime, renderer, and their types on the same major version.
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      astro:
        # Astro and its integrations build on Vite, so test them in one pull request.
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'vite'
      production-dependencies:
        dependency-type: production
        update-types: ['minor', 'patch']
      development-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # Review major upgrades with Astro type-checking support.
      # Revisit using the migration criteria in docs/improvement-backlog.md.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Upgrade Node.js and its major type version together (package.json engines).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
