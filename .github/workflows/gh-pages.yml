name: GitHub Pages for my blog

on:
  # マージされたプルリクエストは常にプッシュになる
  push:
    branches:
      - main

# GitHub PagesへデプロイするためのGITHUB_TOKENの権限設定
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # GitHub Pagesへデプロイするためのコミットはbotが行うものとする
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build with Astro
        env:
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ secrets.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
        run: yarn build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
